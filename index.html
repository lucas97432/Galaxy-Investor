<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxy Investor | High-End Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.65);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            color: white; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- ARRIÈRE-PLAN ANIMÉ (ÉTOILES) --- */
        #canvas-stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        /* --- CONTAINER FLUIDE --- */
        .main-wrapper {
            width: 100%; max-width: 400px; padding: 20px;
            z-index: 10;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header h1 { 
            margin: 0; font-size: 1.8rem; letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- INPUTS & FORMS --- */
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            width: 100%; padding: 15px; border-radius: 12px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
            color: white; font-size: 1rem; transition: 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }

        .btn {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; font-weight: bold; font-size: 1rem; cursor: pointer;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn:active { transform: translateY(0); }

        .footer-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b; }
        .footer-link span { color: var(--primary); cursor: pointer; font-weight: 600; }

        .hidden { display: none; }

        /* OTP INPUTS */
        .otp-container { display: flex; justify-content: center; gap: 10px; }
        .otp-input { width: 100%; text-align: center; font-size: 1.5rem; font-weight: bold; }

        #status-msg {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 50px; font-size: 0.9rem;
            display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <canvas id="canvas-stars"></canvas>

    <div class="main-wrapper">
        <div class="brand-header">
            <h1>GALAXY INVESTOR</h1>
        </div>

        <div id="view-login" class="card">
            <h2>Connexion</h2>
            <form onsubmit="doLogin(event)">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="nom@exemple.com" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">ACCÉDER AU TERMINAL</button>
            </form>
            <div class="footer-link">Pas de compte ? <span onclick="switchView('register')">Créer un accès</span></div>
        </div>

        <div id="view-register" class="card hidden">
            <h2>Nouvel Accès</h2>
            <form onsubmit="doRegister(event)">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="email@test.com" required>
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="reg-password" placeholder="8+ caractères" required minlength="8">
                </div>
                <button type="submit" class="btn">CRÉER MON COMPTE</button>
            </form>
            <div class="footer-link">Déjà inscrit ? <span onclick="switchView('login')">Se connecter</span></div>
        </div>

        <div id="view-otp" class="card hidden">
            <h2>Vérification</h2>
            <p style="text-align:center; color:#94a3b8; font-size:0.8rem;">Entrez le code reçu par mail.</p>
            <form onsubmit="doVerifyOTP(event)">
                <div class="input-group">
                    <input type="text" id="otp-code" placeholder="Code à 6 chiffres" maxlength="6" class="otp-input" required>
                </div>
                <button type="submit" class="btn">VÉRIFIER LE CODE</button>
            </form>
            <div class="footer-link"><span onclick="switchView('login')">Retour</span></div>
        </div>
    </div>

    <div id="status-msg"></div>

    <script>
        // --- CONFIGURATION CONNECTÉE ---
        const SUPABASE_URL = "https://fwkisfdoqazapjdnhmwb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_MSJBTK0-UaBjtoeQTgJ1XQ_pvS3NM_h";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- GESTION DE L'AFFICHAGE ---
        function switchView(view) {
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
        }

        function notify(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.style.display = 'block';
            el.style.background = isError ? '#ef4444' : '#10b981';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        // --- LOGIQUE AUTHENTIFICATION ---
        let currentEmail = "";

        async function doRegister(e) {
            e.preventDefault();
            currentEmail = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            
            const { data, error } = await sb.auth.signUp({ 
                email: currentEmail, 
                password: pass 
            });

            if (error) notify(error.message, true);
            else {
                notify("Inscription réussie ! Vérifiez vos mails.");
                switchView('otp'); // On passe à la vérification
            }
        }

        async function doLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            
            const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

            if (error) notify("Identifiants invalides", true);
            else {
                notify("Connexion réussie ! Bienvenue.");
                // ICI: Redirection vers ton dashboard
            }
        }

        async function doVerifyOTP(e) {
            e.preventDefault();
            const token = document.getElementById('otp-code').value;
            
            const { data, error } = await sb.auth.verifyOtp({
                email: currentEmail,
                token: token,
                type: 'signup'
            });

            if (error) notify("Code incorrect ou expiré", true);
            else {
                notify("Compte validé ! Connectez-vous.");
                switchView('login');
            }
        }

        // --- ANIMATION ARRIÈRE-PLAN (PARTICULES) ---
        const canvas = document.getElementById('canvas-stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initStars();
        animate();
    </script>
</body>
</html>
